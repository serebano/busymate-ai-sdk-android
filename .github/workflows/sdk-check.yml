name: SDK checks
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      hosted_commit:
        description: 'Verified live native-chat commit (leave both inputs empty for ordinary smoke)'
        required: false
        type: string
      hosted_build:
        description: 'Matching verified live build number; enables real OS grant/deny acceptance'
        required: false
        type: string
permissions:
  contents: read
jobs:
  sdk-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the declared native-chat live revision before permission acceptance
        if: github.event_name == 'workflow_dispatch' && (inputs.hosted_commit != '' || inputs.hosted_build != '')
        env:
          BUSYMATE_HOSTED_COMMIT: ${{ inputs.hosted_commit }}
          BUSYMATE_HOSTED_BUILD: ${{ inputs.hosted_build }}
        run: python3 scripts/assert-hosted-release.py "$RUNNER_TEMP/native-permission-live-guard.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify immutable source
        run: python3 scripts/verify-release.py
      - name: Build SDK and consumer APK
        run: ./gradlew :sdk:assembleRelease :example-app:assembleDebug :example-app:testDebugUnitTest :sdk:lintRelease :example-app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: busymate-ai-sdk-android-1.0.0
          path: sdk/build/outputs/aar/sdk-release.aar
      - name: Prepare hosted runner emulator
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          sudo chmod a+rw /dev/kvm
      - name: Run actual demo on an isolated Android emulator
        if: github.event_name != 'workflow_dispatch' || (inputs.hosted_commit == '' && inputs.hosted_build == '')
        run: bash scripts/test-runtime.sh
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.hosted_commit == '' && inputs.hosted_build == ''))
        with:
          name: android-native-runtime-results
          include-hidden-files: true
          path: |
            example-app/build/outputs/androidTest-results/
            example-app/build/reports/androidTests/
            .runtime-results/
          retention-days: 7
      - name: Verify first-tap OS permission against the confirmed live build
        if: github.event_name == 'workflow_dispatch' && (inputs.hosted_commit != '' || inputs.hosted_build != '')
        env:
          BUSYMATE_HOSTED_COMMIT: ${{ inputs.hosted_commit }}
          BUSYMATE_HOSTED_BUILD: ${{ inputs.hosted_build }}
        run: bash scripts/test-permissions.sh
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.hosted_commit != '' || inputs.hosted_build != '')
        with:
          name: android-first-tap-permission-results
          include-hidden-files: true
          path: .permission-results/
          retention-days: 7
